name: Preview screenshots

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    env:
      FIREBASE_PROJECT_ID: demo-santo-terco
      FIREBASE_DATABASE_ID: santo-terco-bookclub-prod
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
      NEXT_PUBLIC_FIREBASE_API_KEY: demo-key
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: demo-santo-terco
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: demo-santo-terco.firebaseapp.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save --no-audit --no-fund playwright sharp firebase-tools
      - run: npx playwright install --with-deps chromium
      - run: node scripts/ci/demo-assets.mjs
      - run: npm run build
      - run: mkdir -p shots && npx firebase-tools emulators:exec --only firestore --project demo-santo-terco "bash scripts/ci/run-shots.sh"
      - name: Publicar screenshots no ramo ci-screenshots
        if: always()
        run: |
          cd shots
          git init -q -b ci-screenshots
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -qm "Screenshots ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" ci-screenshots
